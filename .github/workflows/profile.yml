name: Profile cards

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", ".github/scripts/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=dhivadhiva&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&show=prs_merged,prs_merged_percentage,reviews&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pin - CloudDrop
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=CloudDrop&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-clouddrop.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - CrossShell
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=CrossShell&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-crossshell.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - DiskRescue
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=DiskRescue&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-diskrescue.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - Kilonova
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=kilonova&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-kilonova.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - BranchPilot
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=BranchPilot&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-branchpilot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - Gearwise
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=gearwise&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-gearwise.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Profile numbers
        run: |
          set -euo pipefail
          U=dhivadhiva
          ORG=Dhiva-Labs

          search() {
            gh api graphql -f q="$1" \
              -f query='query($q:String!){search(query:$q,type:ISSUE,first:1){issueCount}}' \
              --jq .data.search.issueCount
          }
          prs=$(search "author:$U is:pr")
          merged=$(search "author:$U is:pr is:merged")
          issues=$(search "author:$U is:issue")
          upstream=$(search "author:$U is:pr is:merged -org:$ORG -user:$U")

          commits=0; contributions=0
          since=$(gh api "users/$U" --jq '.created_at[:4]')
          for y in $(seq "$since" "$(date -u +%Y)"); do
            read -r c t < <(gh api graphql -f login="$U" \
              -f from="${y}-01-01T00:00:00Z" -f to="${y}-12-31T23:59:59Z" \
              -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){totalCommitContributions contributionCalendar{totalContributions}}}}' \
              --jq '.data.user.contributionsCollection | "\(.totalCommitContributions) \(.contributionCalendar.totalContributions)"')
            commits=$((commits + c)); contributions=$((contributions + t))
          done

          repos=$(gh api "orgs/$ORG" --jq .public_repos)
          stars=$(gh api --paginate "orgs/$ORG/repos?type=public&per_page=100" --jq '.[].stargazers_count' | awk '{s+=$1} END {print s+0}')
          releases=0
          for r in $(gh api --paginate "orgs/$ORG/repos?type=public&per_page=100" --jq '.[] | select(.fork | not) | .name'); do
            n=$(gh api --paginate "repos/$ORG/$r/releases?per_page=100" --jq length | awk '{s+=$1} END {print s+0}')
            releases=$((releases + n))
          done

          mkdir -p profile
          jq -n \
            --argjson commits "$commits" --argjson contributions "$contributions" \
            --argjson prs "$prs" --argjson merged "$merged" --argjson issues "$issues" \
            --argjson upstream "$upstream" --argjson repos "$repos" \
            --argjson stars "$stars" --argjson releases "$releases" \
            --arg updated "$(date -u +%Y-%m-%d)" \
            '$ARGS.named' > profile/numbers.json
          cat profile/numbers.json

      - name: Upstream PRs and browser extensions
        # Rewrites the UPSTREAM and EXTENSIONS blocks of README.md from the
        # GitHub search API and the public addons.mozilla.org API.
        run: python3 .github/scripts/profile_sections.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: dhivadhiva
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
