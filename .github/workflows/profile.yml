name: Profile cards

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", ".github/scripts/**"]

permissions:
  contents: write

# One refresh at a time, so two runs never race to push.
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: README sections and profile numbers
        # Rewrites the marked blocks of README.md and profile/numbers.json,
        # and outputs pin1..pin6: the repositories to feature today.
        id: sections
        run: python3 .github/scripts/profile_sections.py

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=dhivadhiva&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&show=prs_merged,prs_merged_percentage,reviews&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pin 1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=${{ steps.sections.outputs.pin1 }}&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin 2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=${{ steps.sections.outputs.pin2 }}&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin 3
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=${{ steps.sections.outputs.pin3 }}&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-3.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin 4
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=${{ steps.sections.outputs.pin4 }}&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-4.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin 5
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=${{ steps.sections.outputs.pin5 }}&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-5.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin 6
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dhiva-Labs&repo=${{ steps.sections.outputs.pin6 }}&theme=tokyonight&hide_border=true&description_lines_count=2
          path: profile/pin-6.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git push

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: dhivadhiva
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
