<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="J.A.R.V.I.S. heads-up display">
<style>text{font-family:'Fira Code','JetBrains Mono',ui-monospace,Consolas,monospace}.k{fill:#7DD3FC;letter-spacing:.18em;font-size:10px}.l{fill:#E2E8F0;font-size:13px;opacity:0;animation:boot 18s linear infinite}.dim{fill:#64748B;font-size:11px}.gold{fill:#F59E0B}.green{fill:#4ADE80}.ring{transform-origin:150px 150px;transform-box:view-box}.spin{animation:spin 14s linear infinite}.spinr{animation:spin 9s linear infinite reverse}.core{transform-origin:150px 150px;transform-box:view-box;animation:pulse 2.4s ease-in-out infinite}.glow{transform-origin:150px 150px;transform-box:view-box;animation:glow 2.4s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 18s ease-out infinite}.cur{animation:blink 1s steps(2,start) infinite}.scan{animation:scan 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}@keyframes blink{to{visibility:hidden}}@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(330px)}}@keyframes grow{0%,10%{transform:scaleX(0)}30%{transform:scaleX(1)}93%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}@keyframes boot0{0%,3%{opacity:0}6%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l0{animation-name:boot0}@keyframes boot1{0%,11%{opacity:0}14%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l1{animation-name:boot1}@keyframes boot2{0%,19%{opacity:0}22%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l2{animation-name:boot2}@keyframes boot3{0%,27%{opacity:0}30%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l3{animation-name:boot3}@keyframes boot4{0%,35%{opacity:0}38%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l4{animation-name:boot4}@keyframes boot5{0%,43%{opacity:0}46%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l5{animation-name:boot5}@keyframes boot6{0%,51%{opacity:0}54%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}.l6{animation-name:boot6}</style>
<defs>
<radialGradient id="core"><stop offset="0" stop-color="#F0F9FF"/><stop offset=".45" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0EA5E9" stop-opacity=".2"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
